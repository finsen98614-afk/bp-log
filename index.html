<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1416">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>BP Log</title>
<style>
  :root{
    --bg:#0E1416; --panel:#161E21; --panel-2:#1D262A; --line:#2A363A;
    --text:#E7EEEF; --muted:#8FA3A8;
    --mono:'JetBrains Mono','Roboto Mono',monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --normal:#4FBE82; --elevated:#E0B24C; --high1:#E08A4C;
    --high2:#E0604C; --crisis:#C13A3A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 80px;}

  header{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  header h1{font-family:var(--mono);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600;}
  .count{font-family:var(--mono);font-size:11px;color:var(--muted);}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;}
  .stat{background:var(--panel);padding:11px 12px;}
  .stat .lbl{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);}
  .stat .val{font-family:var(--mono);font-size:21px;margin-top:3px;font-weight:600;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:14px;}
  .clock{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:11px;}
  .clock b{color:var(--text);font-weight:600;}
  label{display:block;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-family:var(--mono);}
  input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:11px 9px;font-family:var(--mono);font-size:16px;}
  input:focus{outline:none;border-color:var(--muted);}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px;}
  .fld{margin-bottom:10px;}
  button{font-family:var(--mono);border-radius:7px;cursor:pointer;border:none;}
  .send{width:100%;background:var(--normal);color:#08130D;padding:13px;font-weight:700;font-size:14px;letter-spacing:.04em;}
  .send:active{filter:brightness(.92);}
  .send:disabled{opacity:.45;}
  .tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  .ghost{flex:1;min-width:88px;background:none;border:1px solid var(--line);color:var(--muted);padding:9px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;}
  .ghost:active{border-color:var(--muted);color:var(--text);}
  .ghost:disabled{opacity:.4;}

  .msg{font-family:var(--mono);font-size:11px;line-height:1.5;margin-top:9px;min-height:15px;}
  .msg.err{color:var(--high2);}
  .msg.ok{color:var(--normal);}
  .msg.warn{color:var(--elevated);}

  .banner{font-family:var(--mono);font-size:11px;line-height:1.5;padding:10px 11px;border-radius:8px;margin-bottom:14px;display:none;}
  .banner.danger{background:rgba(193,58,58,.12);border:1px solid var(--crisis);color:#F0A7A7;}
  .banner.warn{background:rgba(224,178,76,.12);border:1px solid var(--elevated);color:#E8CE8C;}

  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px 8px;margin-bottom:14px;}
  .chartbox h2{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px;font-weight:600;}
  svg{display:block;width:100%;height:auto;}

  .log{display:flex;flex-direction:column;gap:6px;}
  .entry{display:grid;grid-template-columns:5px 1fr auto auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;}
  .bar{align-self:stretch;border-radius:3px;}
  .reading{font-family:var(--mono);font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:7px;}
  .reading .pulse{font-size:11px;color:var(--muted);font-weight:500;}
  .date{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px;}
  .note{font-size:11.5px;color:var(--muted);margin-top:2px;font-style:italic;word-break:break-word;}
  .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border-radius:4px;white-space:nowrap;}
  .del{background:none;color:var(--muted);font-size:19px;line-height:1;padding:4px 7px;}
  .del:active{color:var(--high2);}
  .empty{color:var(--muted);font-family:var(--mono);font-size:11.5px;text-align:center;padding:22px 0;}
  input[type=file]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Blood Pressure Log</h1>
    <span class="count" id="count">—</span>
  </header>

  <div class="banner" id="banner"></div>
  <div class="banner" id="reminder"></div>

  <div class="stats">
    <div class="stat"><div class="lbl">Avg Sys</div><div class="val" id="avgSys">—</div></div>
    <div class="stat"><div class="lbl">Avg Dia</div><div class="val" id="avgDia">—</div></div>
    <div class="stat"><div class="lbl">Latest</div><div class="val" id="latest">—</div></div>
  </div>

  <div class="card">
    <div class="clock">Logging at <b id="clock"></b></div>
    <div class="row3">
      <div><label>Systolic</label><input type="number" inputmode="numeric" id="fSys" placeholder="120"></div>
      <div><label>Diastolic</label><input type="number" inputmode="numeric" id="fDia" placeholder="80"></div>
      <div><label>Pulse</label><input type="number" inputmode="numeric" id="fPulse" placeholder="70"></div>
    </div>
    <div class="fld">
      <label>Comment (optional)</label>
      <input type="text" id="fNote" placeholder="e.g. 啱啱飲完咖啡">
    </div>
    <button class="send" id="addBtn">+ Add Reading</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="tools">
    <button class="ghost" id="csvBtn">CSV</button>
    <button class="ghost" id="backupBtn">Backup</button>
    <button class="ghost" id="shareBtn">Email</button>
    <button class="ghost" id="restoreBtn">Restore</button>
    <input type="file" id="restoreFile" accept="application/json,.json">
  </div>

  <div class="chartbox" id="chartbox" style="display:none;">
    <h2>Last 30 readings</h2>
    <div id="chart"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
(function(){
  'use strict';

  const DB_NAME='bpLogDB', STORE='readings', DB_VER=1;
  let db=null, entries=[], idCounter=0;
  const SESSION_BASE=Date.now();

  function newId(){ idCounter+=1; return SESSION_BASE*1000+idCounter; }
  const pad=n=>String(n).padStart(2,'0');
  function nowStr(){
    const d=new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function todayStr(){
    const d=new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function esc(s){const e=document.createElement('div');e.textContent=s;return e.innerHTML;}
  function setMsg(t,c){const e=document.getElementById('msg');e.textContent=t||'';e.className='msg '+(c||'');}

  function classify(s,d){
    if(s>=180||d>=120) return {l:'Crisis',c:'var(--crisis)'};
    if(s>=140||d>=90)  return {l:'High 2',c:'var(--high2)'};
    if(s>=130||d>=80)  return {l:'High 1',c:'var(--high1)'};
    if(s>=120)         return {l:'Elevated',c:'var(--elevated)'};
    return {l:'Normal',c:'var(--normal)'};
  }

  function normalize(en){
    return {
      id: Number.isFinite(en&&en.id)?Math.trunc(en.id):newId(),
      date: (en&&en.date)?String(en.date):nowStr(),
      sys: Math.trunc(Number(en&&en.sys)),
      dia: Math.trunc(Number(en&&en.dia)),
      pulse:(en&&en.pulse!=null&&Number.isFinite(Number(en.pulse)))?Math.trunc(Number(en.pulse)):null,
      note:(en&&en.note)?String(en.note):null
    };
  }
  function sortEntries(l){ return l.slice().sort((a,b)=> b.date.localeCompare(a.date)||b.id-a.id); }

  // ---------- IndexedDB ----------
  function openDB(){
    return new Promise((res,rej)=>{
      const req=indexedDB.open(DB_NAME,DB_VER);
      req.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'id'});
      };
      req.onsuccess=e=>res(e.target.result);
      req.onerror=e=>rej(e.target.error||new Error('indexedDB open failed'));
    });
  }
  function tx(mode){ return db.transaction(STORE,mode).objectStore(STORE); }
  function dbAll(){
    return new Promise((res,rej)=>{
      const r=tx('readonly').getAll();
      r.onsuccess=()=>res(r.result||[]);
      r.onerror=()=>rej(r.error);
    });
  }
  function dbPut(rec){
    return new Promise((res,rej)=>{
      const r=tx('readwrite').put(rec);
      r.onsuccess=()=>res(true);
      r.onerror=()=>rej(r.error);
    });
  }
  function dbDel(id){
    return new Promise((res,rej)=>{
      const r=tx('readwrite').delete(id);
      r.onsuccess=()=>res(true);
      r.onerror=()=>rej(r.error);
    });
  }
  function dbPutMany(list){
    return new Promise((res,rej)=>{
      const t=db.transaction(STORE,'readwrite');
      const s=t.objectStore(STORE);
      list.forEach(r=>s.put(r));
      t.oncomplete=()=>res(true);
      t.onerror=()=>rej(t.error);
    });
  }

  function showBanner(text){
    const b=document.getElementById('banner');
    b.style.display='block';
    b.className='banner danger';
    b.textContent=text;
  }

  // ---------- rendering ----------
  function avg(k){
    if(!entries.length) return '—';
    return Math.round(entries.reduce((a,b)=>a+b[k],0)/entries.length);
  }

  function renderChart(){
    const box=document.getElementById('chartbox');
    const data=sortEntries(entries).slice(0,30).reverse();
    if(data.length<2){ box.style.display='none'; return; }
    box.style.display='block';

    const W=520,H=180,pad={l:34,r:8,t:10,b:20};
    const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
    const all=data.flatMap(d=>[d.sys,d.dia]);
    let lo=Math.min(...all)-8, hi=Math.max(...all)+8;
    lo=Math.floor(lo/10)*10; hi=Math.ceil(hi/10)*10;
    const x=i=> pad.l + (data.length===1?iw/2:(i/(data.length-1))*iw);
    const y=v=> pad.t + ih - ((v-lo)/(hi-lo))*ih;
    const path=key=> data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d[key]).toFixed(1)).join(' ');

    let grid='';
    const step=(hi-lo)/4;
    for(let i=0;i<=4;i++){
      const v=lo+step*i, yy=y(v);
      grid+=`<line x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${W-pad.r}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
      grid+=`<text x="${pad.l-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--muted)">${Math.round(v)}</text>`;
    }
    const dots=key=>data.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d[key]).toFixed(1)}" r="2.4" fill="${key==='sys'?'var(--high2)':'var(--normal)'}"/>`).join('');

    document.getElementById('chart').innerHTML=
      `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Systolic and diastolic trend">
        ${grid}
        <path d="${path('sys')}" fill="none" stroke="var(--high2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="${path('dia')}" fill="none" stroke="var(--normal)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots('sys')}${dots('dia')}
        <text x="${pad.l}" y="${H-6}" font-family="var(--mono)" font-size="9" fill="var(--muted)">${esc(data[0].date.slice(5,10))}</text>
        <text x="${W-pad.r}" y="${H-6}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--muted)">${esc(data[data.length-1].date.slice(5,10))}</text>
      </svg>`;
  }

  function render(){
    document.getElementById('count').textContent = entries.length + (entries.length===1?' entry':' entries');
    document.getElementById('avgSys').textContent = avg('sys');
    document.getElementById('avgDia').textContent = avg('dia');
    document.getElementById('latest').textContent = entries.length? entries[0].sys+'/'+entries[0].dia : '—';

    ['csvBtn','backupBtn','shareBtn'].forEach(id=>{ document.getElementById(id).disabled = entries.length===0; });

    const log=document.getElementById('log');
    if(!entries.length){
      log.innerHTML='<div class="empty">No readings yet.</div>';
    }else{
      log.innerHTML=entries.map(en=>{
        const c=classify(en.sys,en.dia);
        return `<div class="entry">
          <div class="bar" style="background:${c.c}"></div>
          <div>
            <div class="reading">${en.sys}/${en.dia}${en.pulse!=null?`<span class="pulse">${en.pulse} bpm</span>`:''}</div>
            <div class="date">${esc(en.date)}</div>
            ${en.note?`<div class="note">${esc(en.note)}</div>`:''}
          </div>
          <span class="tag" style="color:${c.c};border:1px solid ${c.c}">${c.l}</span>
          <button class="del" data-del="${en.id}" aria-label="Delete">&times;</button>
        </div>`;
      }).join('');
      log.querySelectorAll('[data-del]').forEach(b=>{
        b.addEventListener('click',()=>removeEntry(parseInt(b.getAttribute('data-del'),10)));
      });
    }
    renderChart();
    updateReminder();
  }

  // ---------- actions ----------
  async function onAdd(){
    setMsg('');
    const sRaw=document.getElementById('fSys').value.trim();
    const dRaw=document.getElementById('fDia').value.trim();
    const pRaw=document.getElementById('fPulse').value.trim();
    const note=document.getElementById('fNote').value.trim();
    const s=parseInt(sRaw,10), d=parseInt(dRaw,10);

    if(!Number.isFinite(s)||s<40||s>260){ setMsg('Systolic must be 40–260.','err'); return; }
    if(!Number.isFinite(d)||d<20||d>200){ setMsg('Diastolic must be 20–200.','err'); return; }
    if(s<=d){ setMsg('Systolic should be higher than diastolic.','err'); return; }
    let p=null;
    if(pRaw!==''){
      p=parseInt(pRaw,10);
      if(!Number.isFinite(p)||p<25||p>250){ setMsg('Pulse must be 25–250 or blank.','err'); return; }
    }

    const rec=normalize({id:newId(),date:nowStr(),sys:s,dia:d,pulse:p,note:note||null});
    try{
      await dbPut(rec);
    }catch(e){
      setMsg('Save failed: '+(e.message||e)+' — nothing was recorded.','err');
      return;
    }
    entries=sortEntries([rec,...entries]);
    render();
    ['fSys','fDia','fPulse','fNote'].forEach(id=>{document.getElementById(id).value='';});
    setMsg('Saved '+rec.date+'.','ok');
  }

  async function removeEntry(id){
    try{
      await dbDel(id);
    }catch(e){
      setMsg('Delete failed: '+(e.message||e),'err');
      return;
    }
    entries=entries.filter(x=>x.id!==id);
    render();
    setMsg('Deleted.','ok');
  }

  function download(content,mime,name){
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }

  function exportCsv(){
    if(!entries.length) return;
    const rows=[['Date & Time','Systolic','Diastolic','Pulse','Category','Comment']];
    entries.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(en=>{
      const c=classify(en.sys,en.dia);
      rows.push([en.date,en.sys,en.dia,en.pulse!=null?en.pulse:'',c.l,en.note?'"'+en.note.replace(/"/g,'""')+'"':'']);
    });
    download('\uFEFF'+rows.map(r=>r.join(',')).join('\r\n'),'text/csv;charset=utf-8;','bp-log-'+todayStr()+'.csv');
    setMsg('CSV downloaded.','ok');
  }

  const META_ID = -1; // reserved key in the same store for app metadata
  let lastBackup = null;

  function markBackedUp(){
    lastBackup = todayStr();
    dbPut({id:META_ID, meta:true, lastBackup:lastBackup}).catch(()=>{});
    updateReminder();
  }

  function daysSince(dateStr){
    if(!dateStr) return null;
    const then=new Date(dateStr+'T00:00:00');
    if(isNaN(then)) return null;
    return Math.floor((Date.now()-then.getTime())/86400000);
  }

  function updateReminder(){
    const b=document.getElementById('reminder');
    if(!b) return;
    if(!entries.length){ b.style.display='none'; return; }
    const d=daysSince(lastBackup);
    if(lastBackup===null){
      b.style.display='block';
      b.className='banner warn';
      b.textContent='Never backed up. Data lives only on this phone — tap Email or Backup.';
    }else if(d!==null && d>=30){
      b.style.display='block';
      b.className='banner warn';
      b.textContent='Last backup was '+d+' days ago. Tap Email to send yourself a fresh copy.';
    }else{
      b.style.display='none';
    }
  }

  async function shareBackup(){
    if(!entries.length) return;
    const name='bp-backup-'+todayStr()+'.json';
    const body=JSON.stringify(entries,null,2);

    // Web Share Level 2: hands the file to Gmail/Drive/etc. with the attachment already set.
    if(navigator.canShare && typeof File==='function'){
      try{
        const file=new File([body],name,{type:'application/json'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({
            files:[file],
            title:'Blood pressure backup',
            text:'BP backup — '+entries.length+' readings as of '+todayStr()+'.'
          });
          markBackedUp();
          setMsg('Shared '+entries.length+' readings.','ok');
          return;
        }
      }catch(err){
        if(err && err.name==='AbortError'){ setMsg('Share cancelled.',''); return; }
        // fall through to download
      }
    }
    download(body,'application/json;charset=utf-8;',name);
    setMsg('Sharing unavailable here — file downloaded instead, attach it manually.','warn');
  }

  function backup(){
    if(!entries.length) return;
    download(JSON.stringify(entries,null,2),'application/json;charset=utf-8;','bp-backup-'+todayStr()+'.json');
    markBackedUp();
    setMsg('Backup downloaded.','ok');
  }

  function restore(e){
    const file=e.target.files&&e.target.files[0];
    if(!file) return;
    const r=new FileReader();
    r.onload=async ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!Array.isArray(parsed)) throw new Error('not a backup file');
        const valid=parsed
          .filter(x=>x&&Number.isFinite(Number(x.sys))&&Number.isFinite(Number(x.dia))&&x.date)
          .map(normalize);
        if(!valid.length) throw new Error('no valid entries');
        await dbPutMany(valid);
        const byId={};
        entries.forEach(en=>byId[en.id]=en);
        valid.forEach(en=>byId[en.id]=en);
        entries=sortEntries(Object.values(byId));
        render();
        setMsg('Restored '+valid.length+' entries.','ok');
      }catch(err){
        setMsg('Restore failed: '+err.message,'err');
      }
    };
    r.onerror=()=>setMsg('Restore failed: could not read file.','err');
    r.readAsText(file);
    e.target.value='';
  }

  // ---------- init ----------
  function tickClock(){
    const el=document.getElementById('clock');
    if(el) el.textContent=nowStr();
  }

  async function init(){
    tickClock();
    setInterval(tickClock,15000);

    document.getElementById('addBtn').addEventListener('click',onAdd);
    document.getElementById('csvBtn').addEventListener('click',exportCsv);
    document.getElementById('backupBtn').addEventListener('click',backup);
    document.getElementById('shareBtn').addEventListener('click',shareBackup);
    document.getElementById('restoreBtn').addEventListener('click',()=>document.getElementById('restoreFile').click());
    document.getElementById('restoreFile').addEventListener('change',restore);
    ['fSys','fDia','fPulse','fNote'].forEach(id=>{
      document.getElementById(id).addEventListener('keydown',ev=>{ if(ev.key==='Enter') onAdd(); });
    });

    try{
      db=await openDB();
      const all=await dbAll();
      const meta=all.find(r=>r&&r.meta===true);
      lastBackup=meta&&meta.lastBackup?meta.lastBackup:null;
      entries=sortEntries(all.filter(r=>r&&r.meta!==true).map(normalize));
    }catch(e){
      showBanner('Local database unavailable ('+(e.message||e)+'). Entries cannot be saved on this device — try a normal (non-private) browser window.');
      document.getElementById('addBtn').disabled=true;
    }
    render();

    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persist().catch(()=>{});
    }
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  }

  init();
})();
</script>
</body>
</html>
